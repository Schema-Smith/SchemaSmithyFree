name: validate-demo-schemas

on:
  pull_request:
    paths:
      - 'Demos/**/*.json'
      - 'Demos/**/.json-schemas/*.schema'
      - '.github/workflows/validate-demo-schemas.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:

          # ── SqlServer – 4 sample databases ───────────────────────────────
          - name: SqlServer-AdventureWorks-Tables
            schema: Demos/SqlServer/AdventureWorks/.json-schemas/tables.sqlserver.schema
            files: Demos/SqlServer/AdventureWorks/Templates/**/Tables/**/*.json

          - name: SqlServer-AdventureWorks-Products
            schema: Demos/SqlServer/AdventureWorks/.json-schemas/products.sqlserver.schema
            files: Demos/SqlServer/AdventureWorks/Product.json

          - name: SqlServer-AdventureWorks-Templates
            schema: Demos/SqlServer/AdventureWorks/.json-schemas/templates.sqlserver.schema
            files: Demos/SqlServer/AdventureWorks/Templates/*/Template.json

          - name: SqlServer-Chinook-Tables
            schema: Demos/SqlServer/Chinook/.json-schemas/tables.sqlserver.schema
            files: Demos/SqlServer/Chinook/Templates/**/Tables/**/*.json

          - name: SqlServer-Chinook-Products
            schema: Demos/SqlServer/Chinook/.json-schemas/products.sqlserver.schema
            files: Demos/SqlServer/Chinook/Product.json

          - name: SqlServer-Chinook-Templates
            schema: Demos/SqlServer/Chinook/.json-schemas/templates.sqlserver.schema
            files: Demos/SqlServer/Chinook/Templates/*/Template.json

          - name: SqlServer-Northwind-Tables
            schema: Demos/SqlServer/Northwind/.json-schemas/tables.sqlserver.schema
            files: Demos/SqlServer/Northwind/Templates/**/Tables/**/*.json

          - name: SqlServer-Northwind-Products
            schema: Demos/SqlServer/Northwind/.json-schemas/products.sqlserver.schema
            files: Demos/SqlServer/Northwind/Product.json

          - name: SqlServer-Northwind-Templates
            schema: Demos/SqlServer/Northwind/.json-schemas/templates.sqlserver.schema
            files: Demos/SqlServer/Northwind/Templates/*/Template.json

          - name: SqlServer-Sakila-Tables
            schema: Demos/SqlServer/Sakila/.json-schemas/tables.sqlserver.schema
            files: Demos/SqlServer/Sakila/Templates/**/Tables/**/*.json

          - name: SqlServer-Sakila-Products
            schema: Demos/SqlServer/Sakila/.json-schemas/products.sqlserver.schema
            files: Demos/SqlServer/Sakila/Product.json

          - name: SqlServer-Sakila-Templates
            schema: Demos/SqlServer/Sakila/.json-schemas/templates.sqlserver.schema
            files: Demos/SqlServer/Sakila/Templates/*/Template.json

          # ── SqlServer – Tutorials ─────────────────────────────────────────
          - name: SqlServer-Tutorial-Product-ValidProduct-Tables
            schema: Demos/SqlServer/Tutorials/Product/ValidProduct/.json-schemas/tables.sqlserver.schema
            files: Demos/SqlServer/Tutorials/Product/ValidProduct/Templates/**/Tables/**/*.json

          - name: SqlServer-Tutorial-Product-ValidProduct-Products
            schema: Demos/SqlServer/Tutorials/Product/ValidProduct/.json-schemas/products.sqlserver.schema
            files: Demos/SqlServer/Tutorials/Product/ValidProduct/Product.json

          - name: SqlServer-Tutorial-Product-ValidProduct-Templates
            schema: Demos/SqlServer/Tutorials/Product/ValidProduct/.json-schemas/templates.sqlserver.schema
            files: Demos/SqlServer/Tutorials/Product/ValidProduct/Templates/*/Template.json

          - name: SqlServer-Tutorial-Template-SaasProduct-Tables
            schema: Demos/SqlServer/Tutorials/Template/SaasProduct/.json-schemas/tables.sqlserver.schema
            files: Demos/SqlServer/Tutorials/Template/SaasProduct/Templates/**/Tables/**/*.json

          - name: SqlServer-Tutorial-Template-SaasProduct-Products
            schema: Demos/SqlServer/Tutorials/Template/SaasProduct/.json-schemas/products.sqlserver.schema
            files: Demos/SqlServer/Tutorials/Template/SaasProduct/Product.json

          - name: SqlServer-Tutorial-Template-SaasProduct-Templates
            schema: Demos/SqlServer/Tutorials/Template/SaasProduct/.json-schemas/templates.sqlserver.schema
            files: Demos/SqlServer/Tutorials/Template/SaasProduct/Templates/*/Template.json

          - name: SqlServer-Tutorial-Template-ValidProduct-Tables
            schema: Demos/SqlServer/Tutorials/Template/ValidProduct/.json-schemas/tables.sqlserver.schema
            files: Demos/SqlServer/Tutorials/Template/ValidProduct/Templates/**/Tables/**/*.json

          - name: SqlServer-Tutorial-Template-ValidProduct-Products
            schema: Demos/SqlServer/Tutorials/Template/ValidProduct/.json-schemas/products.sqlserver.schema
            files: Demos/SqlServer/Tutorials/Template/ValidProduct/Product.json

          - name: SqlServer-Tutorial-Template-ValidProduct-Templates
            schema: Demos/SqlServer/Tutorials/Template/ValidProduct/.json-schemas/templates.sqlserver.schema
            files: Demos/SqlServer/Tutorials/Template/ValidProduct/Templates/*/Template.json

          # ── PostgreSQL – 4 sample databases ──────────────────────────────
          - name: PostgreSQL-AdventureWorks-Tables
            schema: Demos/PostgreSQL/AdventureWorks/.json-schemas/tables.postgresql.schema
            files: Demos/PostgreSQL/AdventureWorks/Templates/**/Tables/**/*.json

          - name: PostgreSQL-AdventureWorks-Products
            schema: Demos/PostgreSQL/AdventureWorks/.json-schemas/products.postgresql.schema
            files: Demos/PostgreSQL/AdventureWorks/Product.json

          - name: PostgreSQL-AdventureWorks-Templates
            schema: Demos/PostgreSQL/AdventureWorks/.json-schemas/templates.postgresql.schema
            files: Demos/PostgreSQL/AdventureWorks/Templates/*/Template.json

          - name: PostgreSQL-AdventureWorks-MaterializedViews
            schema: Demos/PostgreSQL/AdventureWorks/.json-schemas/materializedviews.postgresql.schema
            files: "Demos/PostgreSQL/AdventureWorks/Templates/**/Materialized Views/**/*.json"

          - name: PostgreSQL-Chinook-Tables
            schema: Demos/PostgreSQL/Chinook/.json-schemas/tables.postgresql.schema
            files: Demos/PostgreSQL/Chinook/Templates/**/Tables/**/*.json

          - name: PostgreSQL-Chinook-Products
            schema: Demos/PostgreSQL/Chinook/.json-schemas/products.postgresql.schema
            files: Demos/PostgreSQL/Chinook/Product.json

          - name: PostgreSQL-Chinook-Templates
            schema: Demos/PostgreSQL/Chinook/.json-schemas/templates.postgresql.schema
            files: Demos/PostgreSQL/Chinook/Templates/*/Template.json

          - name: PostgreSQL-Northwind-Tables
            schema: Demos/PostgreSQL/Northwind/.json-schemas/tables.postgresql.schema
            files: Demos/PostgreSQL/Northwind/Templates/**/Tables/**/*.json

          - name: PostgreSQL-Northwind-Products
            schema: Demos/PostgreSQL/Northwind/.json-schemas/products.postgresql.schema
            files: Demos/PostgreSQL/Northwind/Product.json

          - name: PostgreSQL-Northwind-Templates
            schema: Demos/PostgreSQL/Northwind/.json-schemas/templates.postgresql.schema
            files: Demos/PostgreSQL/Northwind/Templates/*/Template.json

          - name: PostgreSQL-Sakila-Tables
            schema: Demos/PostgreSQL/Sakila/.json-schemas/tables.postgresql.schema
            files: Demos/PostgreSQL/Sakila/Templates/**/Tables/**/*.json

          - name: PostgreSQL-Sakila-Products
            schema: Demos/PostgreSQL/Sakila/.json-schemas/products.postgresql.schema
            files: Demos/PostgreSQL/Sakila/Product.json

          - name: PostgreSQL-Sakila-Templates
            schema: Demos/PostgreSQL/Sakila/.json-schemas/templates.postgresql.schema
            files: Demos/PostgreSQL/Sakila/Templates/*/Template.json

          # ── MySQL – 4 sample databases ────────────────────────────────────
          - name: MySQL-AdventureWorks-Tables
            schema: Demos/MySQL/AdventureWorks/.json-schemas/tables.mysql.schema
            files: Demos/MySQL/AdventureWorks/Templates/**/Tables/**/*.json

          - name: MySQL-AdventureWorks-Products
            schema: Demos/MySQL/AdventureWorks/.json-schemas/products.mysql.schema
            files: Demos/MySQL/AdventureWorks/Product.json

          - name: MySQL-AdventureWorks-Templates
            schema: Demos/MySQL/AdventureWorks/.json-schemas/templates.mysql.schema
            files: Demos/MySQL/AdventureWorks/Templates/*/Template.json

          - name: MySQL-Chinook-Tables
            schema: Demos/MySQL/Chinook/.json-schemas/tables.mysql.schema
            files: Demos/MySQL/Chinook/Templates/**/Tables/**/*.json

          - name: MySQL-Chinook-Products
            schema: Demos/MySQL/Chinook/.json-schemas/products.mysql.schema
            files: Demos/MySQL/Chinook/Product.json

          - name: MySQL-Chinook-Templates
            schema: Demos/MySQL/Chinook/.json-schemas/templates.mysql.schema
            files: Demos/MySQL/Chinook/Templates/*/Template.json

          - name: MySQL-Northwind-Tables
            schema: Demos/MySQL/Northwind/.json-schemas/tables.mysql.schema
            files: Demos/MySQL/Northwind/Templates/**/Tables/**/*.json

          - name: MySQL-Northwind-Products
            schema: Demos/MySQL/Northwind/.json-schemas/products.mysql.schema
            files: Demos/MySQL/Northwind/Product.json

          - name: MySQL-Northwind-Templates
            schema: Demos/MySQL/Northwind/.json-schemas/templates.mysql.schema
            files: Demos/MySQL/Northwind/Templates/*/Template.json

          - name: MySQL-Sakila-Tables
            schema: Demos/MySQL/Sakila/.json-schemas/tables.mysql.schema
            files: Demos/MySQL/Sakila/Templates/**/Tables/**/*.json

          - name: MySQL-Sakila-Products
            schema: Demos/MySQL/Sakila/.json-schemas/products.mysql.schema
            files: Demos/MySQL/Sakila/Product.json

          - name: MySQL-Sakila-Templates
            schema: Demos/MySQL/Sakila/.json-schemas/templates.mysql.schema
            files: Demos/MySQL/Sakila/Templates/*/Template.json

          # ── Learn / module-04 ─────────────────────────────────────────────
          - name: Learn-module-04-mysql-Tables
            schema: Demos/Learn/module-04/mysql/solution/.json-schemas/tables.mysql.schema
            files: Demos/Learn/module-04/mysql/solution/Templates/**/Tables/**/*.json

          - name: Learn-module-04-mysql-Products
            schema: Demos/Learn/module-04/mysql/solution/.json-schemas/products.mysql.schema
            files: Demos/Learn/module-04/mysql/solution/Product.json

          - name: Learn-module-04-mysql-Templates
            schema: Demos/Learn/module-04/mysql/solution/.json-schemas/templates.mysql.schema
            files: Demos/Learn/module-04/mysql/solution/Templates/*/Template.json

          - name: Learn-module-04-postgres-Tables
            schema: Demos/Learn/module-04/postgres/solution/.json-schemas/tables.postgresql.schema
            files: Demos/Learn/module-04/postgres/solution/Templates/**/Tables/**/*.json

          - name: Learn-module-04-postgres-Products
            schema: Demos/Learn/module-04/postgres/solution/.json-schemas/products.postgresql.schema
            files: Demos/Learn/module-04/postgres/solution/Product.json

          - name: Learn-module-04-postgres-Templates
            schema: Demos/Learn/module-04/postgres/solution/.json-schemas/templates.postgresql.schema
            files: Demos/Learn/module-04/postgres/solution/Templates/*/Template.json

          - name: Learn-module-04-sqlserver-Tables
            schema: Demos/Learn/module-04/sqlserver/solution/.json-schemas/tables.sqlserver.schema
            files: Demos/Learn/module-04/sqlserver/solution/Templates/**/Tables/**/*.json

          - name: Learn-module-04-sqlserver-Products
            schema: Demos/Learn/module-04/sqlserver/solution/.json-schemas/products.sqlserver.schema
            files: Demos/Learn/module-04/sqlserver/solution/Product.json

          - name: Learn-module-04-sqlserver-Templates
            schema: Demos/Learn/module-04/sqlserver/solution/.json-schemas/templates.sqlserver.schema
            files: Demos/Learn/module-04/sqlserver/solution/Templates/*/Template.json

    steps:
      - uses: actions/checkout@v4

      - name: Validate ${{ matrix.name }}
        uses: GrantBirki/json-yaml-validate@v3.3.0
        with:
          comment: "true"
          use_gitignore: "false"
          ajv_strict_mode: "false"
          json_schema: ${{ matrix.schema }}
          files: ${{ matrix.files }}
