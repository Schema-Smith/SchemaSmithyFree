name: Distribution Publish

# Publishes SchemaSmith to external distribution channels (container registries, winget, AUR)
# when a release is PUBLISHED. It fires ONLY on the gated, deliberate "publish release" action —
# there is deliberately no workflow_dispatch lever, so this is not a manually-runnable publish.
# Each channel job no-ops when its channel's secret is absent, so unconfigured channels are skipped
# rather than failing the run. Channels build from the PUBLISHED release's public assets, so the
# published artifact is exactly what a user downloads.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve version from release tag
        id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  docker:
    # Multi-arch (amd64+arm64) image to GHCR (always, via GITHUB_TOKEN) and Docker Hub (only when
    # DOCKERHUB_TOKEN exists), built from the published release's linux tarballs.
    runs-on: ubuntu-latest
    needs: version
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx (multi-platform builder)
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Publish images (GHCR always; Docker Hub if configured)
        env:
          SS_VERSION: ${{ needs.version.outputs.version }}
          SS_PUSH_HUB: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}
          GH_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash packaging/docker/docker-publish.sh

      # GHCR creates a brand-new package PRIVATE by default, and the push still reports success — so
      # a rename or a second image would publish "successfully" and be unpullable anonymously, with
      # nothing in the run to say so. Visibility persists across pushes, so this is a no-op once a
      # package is public; it exists to stop the trap recurring on the next new package.
      - name: Ensure GHCR package is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api --method PATCH \
               -H "Accept: application/vnd.github+json" \
               "/orgs/${{ github.repository_owner }}/packages/container/schemaquench" \
               -f visibility=public >/dev/null 2>&1; then
            echo "GHCR package visibility set to public."
          else
            echo "::warning::Could not set GHCR package visibility to public. Verify it manually — a private package is not anonymously pullable."
          fi

  winget:
    # Submit/update the SchemaSmith.SchemaSmith manifest in microsoft/winget-pkgs from the
    # published Windows release zips. Skipped when WINGET_PAT is absent.
    runs-on: windows-latest
    needs: version
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gate on WINGET_PAT
        id: gate
        shell: bash
        env:
          HAS: ${{ secrets.WINGET_PAT != '' }}
        run: echo "has=$HAS" >> "$GITHUB_OUTPUT"

      - name: Install wingetcreate
        if: steps.gate.outputs.has == 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe' -OutFile "$env:RUNNER_TEMP\wingetcreate.exe"
          Add-Content -Path $env:GITHUB_PATH -Value $env:RUNNER_TEMP

      - name: Render + submit manifest
        if: steps.gate.outputs.has == 'true'
        shell: pwsh
        env:
          SS_VERSION: ${{ needs.version.outputs.version }}
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: .\packaging\winget\submit.ps1

  aur:
    # Publish the schemasmith-bin PKGBUILD to the AUR from the published linux tarballs.
    # Skipped when AUR_SSH_PRIVATE_KEY is absent.
    runs-on: ubuntu-latest
    needs: version
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gate on AUR_SSH_PRIVATE_KEY
        id: gate
        env:
          HAS: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
        run: echo "has=$HAS" >> "$GITHUB_OUTPUT"

      - name: Render PKGBUILD
        if: steps.gate.outputs.has == 'true'
        env:
          SS_VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/aur/render.sh "$RUNNER_TEMP/PKGBUILD"

      - name: Publish to AUR
        if: steps.gate.outputs.has == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: schemasmith-bin
          pkgbuild: ${{ runner.temp }}/PKGBUILD
          commit_username: SchemaSmith Contributors
          commit_email: support@schemasmith.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.version.outputs.version }}
          allow_empty_commits: false
