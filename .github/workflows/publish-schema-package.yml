name: Publish SchemaSmith.Schema

on:
  release:
    types: [published]

permissions:
  packages: write
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  publish:
    name: Pack & Publish SchemaSmith.Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Schema/Schema.csproj

      - name: Build
        run: dotnet build Schema/Schema.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack Schema/Schema.csproj -c Release --no-build -o ./nupkg

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkg/SchemaSmith.Schema.*.nupkg --source "https://nuget.pkg.github.com/Schema-Smith/index.json" --api-key ${{ secrets.GITHUB_TOKEN }}
