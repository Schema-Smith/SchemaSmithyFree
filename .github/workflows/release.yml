name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: read
  checks: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs \
            --jq "[.check_runs[] | select(.name == \"build\")] | sort_by(.completed_at) | last | .conclusion")
          if [ "$RESULT" != "success" ]; then
            echo "::error::CI job 'build' has not passed (result: $RESULT). Run CI first."
            exit 1
          fi
          echo "CI job 'build': passed"

      - name: Extract version from Directory.Build.props
        id: get-version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "## Release version: $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify tag does not exist
        run: |
          if git rev-parse "v${{ steps.get-version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.get-version.outputs.version }} already exists. Bump the version in Directory.Build.props first."
            exit 1
          fi

      - name: Verify RELEASE_NOTES.md exists and matches version
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "::error::RELEASE_NOTES.md not found in repo root. Copy finalized release notes before releasing."
            exit 1
          fi
          HEADING=$(head -5 RELEASE_NOTES.md | grep -oP '(?<=## ).*' | head -1)
          if ! echo "$HEADING" | grep -q "$VERSION"; then
            echo "::error::RELEASE_NOTES.md heading '$HEADING' does not contain version '$VERSION'. Did you forget to update it?"
            exit 1
          fi
          echo "RELEASE_NOTES.md verified — heading matches version $VERSION"

  build-release:
    runs-on: ubuntu-latest
    needs: read-version
    strategy:
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish tools
        run: |
          for tool in SchemaQuench SchemaTongs DataTongs; do
            dotnet publish $tool/$tool.csproj -c Release -r ${{ matrix.rid }} --self-contained
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            SchemaQuench/bin/Release/net10.0/${{ matrix.rid }}/publish/
            SchemaTongs/bin/Release/net10.0/${{ matrix.rid }}/publish/
            DataTongs/bin/Release/net10.0/${{ matrix.rid }}/publish/
          retention-days: 1

  sign-windows:
    runs-on: windows-latest
    needs: build-release
    environment: release
    permissions:
      contents: read
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.rid }}
          path: bins

      - name: Collect binaries to sign
        shell: pwsh
        run: |
          $ours = @("SchemaQuench.exe", "SchemaTongs.exe", "DataTongs.exe")
          $files = Get-ChildItem -Path bins -Recurse -File |
            Where-Object { $ours -contains $_.Name }
          $staging = New-Item -ItemType Directory -Force -Path sign-staging
          foreach ($f in $files) {
            $dest = "$staging\$($f.Name)"
            if (!(Test-Path $dest)) { Copy-Item $f.FullName $dest }
          }
          Write-Host "Files to sign:"
          Get-ChildItem $staging | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Sign binaries
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: sign-staging
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Copy signed binaries back
        shell: pwsh
        run: |
          $ours = @("SchemaQuench.exe", "SchemaTongs.exe", "DataTongs.exe")
          $signed = Get-ChildItem -Path sign-staging -File
          $targets = Get-ChildItem -Path bins -Recurse -File |
            Where-Object { $ours -contains $_.Name }
          foreach ($s in $signed) {
            $targets | Where-Object { $_.Name -eq $s.Name } | ForEach-Object {
              Copy-Item $s.FullName $_.FullName -Force
              Write-Host "Signed: $($_.FullName)"
            }
          }

      - name: Re-upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}-signed
          path: bins/
          retention-days: 1

  package-zip:
    runs-on: ubuntu-latest
    needs: [build-release, sign-windows, read-version]
    strategy:
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.rid }}${{ startsWith(matrix.rid, 'win-') && '-signed' || '' }}
          path: bins

      - name: Assemble ZIP
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          mkdir -p zip-staging
          for tool in SchemaQuench SchemaTongs DataTongs; do
            src="bins/$tool/bin/Release/net10.0/${{ matrix.rid }}/publish"
            if [ -d "$src" ]; then
              cp "$src"/* zip-staging/ 2>/dev/null || true
            fi
          done
          rm -f zip-staging/*.pdb
          echo "ZIP contents:"
          ls -la zip-staging/
          cd zip-staging && zip -r "../SchemaSmith-${VERSION}-${{ matrix.rid }}.zip" .

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: zip-${{ matrix.rid }}
          path: "SchemaSmith-*.zip"
          retention-days: 5

  create-release:
    runs-on: ubuntu-latest
    needs: [package-zip, read-version]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all ZIPs
        uses: actions/download-artifact@v8
        with:
          pattern: zip-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f

      - name: Create tag
        run: |
          git tag "v${{ needs.read-version.outputs.version }}"
          git push origin "v${{ needs.read-version.outputs.version }}"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "SchemaSmith v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --draft \
            release-assets/*
