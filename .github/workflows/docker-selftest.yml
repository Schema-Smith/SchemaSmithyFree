name: Docker Self-Test

# Builds the SchemaQuench distribution image from a locally-published binary and
# smoke-runs it (--Validate, no database). Publishes NOTHING — no registry login,
# no push. This is the PR green gate for the packaging/docker/ image mechanics.

on:
  pull_request:
    paths: ['packaging/docker/**', '.github/workflows/docker-selftest.yml']
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests (resolution functions)
        run: bash packaging/docker/tests/run-tests.sh

      - name: Build SchemaQuench (linux-x64, self-contained)
        run: bash build-schemaquench.sh

      - name: Stage binary + ICU for the image
        run: |
          mkdir -p publish/linux/amd64
          cp SchemaQuench/publish/SchemaQuench publish/linux/amd64/
          cp SchemaQuench/publish/libicu*.so.* publish/linux/amd64/

      - name: Build image
        run: docker build -f packaging/docker/Dockerfile -t schemaquench:selftest .

      - name: Smoke run (--Validate against a demo package, no DB)
        run: |
          docker run --rm -e SmithySettings_SchemaPackagePath=/pkg \
            -v "$PWD/Demos/PostgreSQL/Northwind:/pkg" schemaquench:selftest --Validate
