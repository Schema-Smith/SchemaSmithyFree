name: schemasmith-postgresql-demo

services:
  quench-adventureworks:
    build:
      context: ../../SchemaQuench
      dockerfile: Dockerfile.release
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${PostGreSQL_USERNAME}
      - SmithySettings_Target__Password=${PostGreSQL_PASSWORD}
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./AdventureWorks:/metadata
    depends_on:
      demoserver:
        condition: service_healthy

  quench-chinook:
    build:
      context: ../../SchemaQuench
      dockerfile: Dockerfile.release
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${PostGreSQL_USERNAME}
      - SmithySettings_Target__Password=${PostGreSQL_PASSWORD}
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./Chinook:/metadata
    depends_on:
      quench-adventureworks:
        condition: service_completed_successfully

  quench-northwind:
    build:
      context: ../../SchemaQuench
      dockerfile: Dockerfile.release
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${PostGreSQL_USERNAME}
      - SmithySettings_Target__Password=${PostGreSQL_PASSWORD}
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./Northwind:/metadata
    depends_on:
      quench-chinook:
        condition: service_completed_successfully

  quench-sakila:
    build:
      context: ../../SchemaQuench
      dockerfile: Dockerfile.release
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${PostGreSQL_USERNAME}
      - SmithySettings_Target__Password=${PostGreSQL_PASSWORD}
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./Sakila:/metadata
    depends_on:
      quench-northwind:
        condition: service_completed_successfully

  quench-tenantcrm:
    build:
      context: ../../SchemaQuench
      dockerfile: Dockerfile.release
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${PostGreSQL_USERNAME}
      - SmithySettings_Target__Password=${PostGreSQL_PASSWORD}
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./TenantCRM:/metadata
    depends_on:
      quench-sakila:
        condition: service_completed_successfully

  demoserver:
    # Overridable via POSTGRES_IMAGE in .env. Must stay PostGIS-enabled — the demo deploys spatial columns.
    image: ${POSTGRES_IMAGE:-postgis/postgis:latest} # PostGIS-enabled PostgreSQL for spatial data support
    platform: linux/amd64 # postgis/postgis has no arm64 manifest; force amd64 emulation on macOS arm64
    ports:
      - "${PostGreSQL_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: TestMain
      POSTGRES_USER: ${PostGreSQL_USERNAME}
      POSTGRES_PASSWORD: ${PostGreSQL_PASSWORD}
      PGPASSWORD: ${PostGreSQL_PASSWORD}
    command: postgres -c max_connections=2000
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${PostGreSQL_USERNAME} -d TestMain -c \"SELECT 1 WHERE (SELECT setting::int FROM pg_settings WHERE name = 'max_connections') >= 2000\" | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  completed:
    image: alpine
    entrypoint: ["echo"]
    command: ["completed"]
    depends_on:
      demoserver:
        condition: service_healthy
      quench-adventureworks:
        condition: service_completed_successfully
      quench-chinook:
        condition: service_completed_successfully
      quench-northwind:
        condition: service_completed_successfully
      quench-sakila:
        condition: service_completed_successfully
      quench-tenantcrm:
        condition: service_completed_successfully
