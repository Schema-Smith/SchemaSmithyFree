# A typical Flyway configuration — shown for reference only. You do NOT run
# Flyway in this lab; the setup already applied these migrations' end state to
# the shop_from_flyway database.
#
# flyway migrate would run V1__create_shop.sql then V2__add_orderitem.sql in
# order, recording each one in the flyway_schema_history table.
flyway.url=jdbc:sqlserver://localhost:11433;databaseName=shop_from_flyway;trustServerCertificate=true
flyway.user=sa
flyway.locations=filesystem:./
