name: schemasmith-sqlserver-demo

services:
  quench-adventureworks:
    build:
      context: ../../SchemaQuench
      dockerfile: Dockerfile.release
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${MSSQL_SA_USERNAME}
      - SmithySettings_Target__Password=${MSSQL_SA_PASSWORD}
      - SmithySettings_Target__ConnectionProperties__TrustServerCertificate=True
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./AdventureWorks:/metadata
    depends_on:
      demoserver:
        condition: service_healthy

  quench-northwind:
    build:
      context: ../../SchemaQuench
      dockerfile: Dockerfile.release
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${MSSQL_SA_USERNAME}
      - SmithySettings_Target__Password=${MSSQL_SA_PASSWORD}
      - SmithySettings_Target__ConnectionProperties__TrustServerCertificate=True
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./Northwind:/metadata
    depends_on:
      quench-adventureworks:
        condition: service_completed_successfully

  quench-sakila:
    build:
      context: ../../SchemaQuench
      dockerfile: Dockerfile.release
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${MSSQL_SA_USERNAME}
      - SmithySettings_Target__Password=${MSSQL_SA_PASSWORD}
      - SmithySettings_Target__ConnectionProperties__TrustServerCertificate=True
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./Sakila:/metadata
    depends_on:
      quench-northwind:
        condition: service_completed_successfully

  quench-chinook:
    build:
      context: ../../SchemaQuench
      dockerfile: Dockerfile.release
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${MSSQL_SA_USERNAME}
      - SmithySettings_Target__Password=${MSSQL_SA_PASSWORD}
      - SmithySettings_Target__ConnectionProperties__TrustServerCertificate=True
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./Chinook:/metadata
    depends_on:
      quench-sakila:
        condition: service_completed_successfully

  quench-tenantcrm:
    build:
      context: ../../SchemaQuench
      dockerfile: Dockerfile.release
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${MSSQL_SA_USERNAME}
      - SmithySettings_Target__Password=${MSSQL_SA_PASSWORD}
      - SmithySettings_Target__ConnectionProperties__TrustServerCertificate=True
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./TenantCRM:/metadata
    depends_on:
      quench-chinook:
        condition: service_completed_successfully

  demoserver:
    build:
      context: ./demoserver
      dockerfile: demoserver.Dockerfile
    restart: always
    ports:
      - "${MSSQL_PORT:-1440}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_USERNAME=${MSSQL_SA_USERNAME}
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    healthcheck:
      # The one-time first-boot system-database upgrade is I/O-bound and can take
      # 15-20+ minutes on a slow/constrained Docker backend, during which the demo
      # databases can't be created yet. Budget generously (~20m grace + 60 x 10s)
      # so the container isn't called unhealthy before init finishes; a fast disk
      # still flips healthy in seconds and proceeds immediately.
      test: /tmp/devdatabase/is-ready.sh
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20m

  completed:
    image: alpine
    entrypoint: ["echo"]
    command: ["completed"]
    depends_on:
      demoserver:
        condition: service_healthy
      quench-adventureworks:
        condition: service_completed_successfully
      quench-northwind:
        condition: service_completed_successfully
      quench-sakila:
        condition: service_completed_successfully
      quench-chinook:
        condition: service_completed_successfully
      quench-tenantcrm:
        condition: service_completed_successfully
