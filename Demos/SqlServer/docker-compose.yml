name: schemasmith-sqlserver-demo

services:
  quench-adventureworks:
    build:
      context: ../../SchemaQuench
      dockerfile: Dockerfile.release
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${MSSQL_SA_USERNAME}
      - SmithySettings_Target__Password=${MSSQL_SA_PASSWORD}
      - SmithySettings_Target__ConnectionProperties__TrustServerCertificate=True
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./AdventureWorks:/metadata
    depends_on:
      demoserver:
        condition: service_healthy

  quench-northwind:
    build:
      context: ../../SchemaQuench
      dockerfile: Dockerfile.release
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${MSSQL_SA_USERNAME}
      - SmithySettings_Target__Password=${MSSQL_SA_PASSWORD}
      - SmithySettings_Target__ConnectionProperties__TrustServerCertificate=True
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./Northwind:/metadata
    depends_on:
      quench-adventureworks:
        condition: service_completed_successfully

  quench-sakila:
    build:
      context: ../../SchemaQuench
      dockerfile: Dockerfile.release
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${MSSQL_SA_USERNAME}
      - SmithySettings_Target__Password=${MSSQL_SA_PASSWORD}
      - SmithySettings_Target__ConnectionProperties__TrustServerCertificate=True
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./Sakila:/metadata
    depends_on:
      quench-northwind:
        condition: service_completed_successfully

  quench-chinook:
    build:
      context: ../../SchemaQuench
      dockerfile: Dockerfile.release
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${MSSQL_SA_USERNAME}
      - SmithySettings_Target__Password=${MSSQL_SA_PASSWORD}
      - SmithySettings_Target__ConnectionProperties__TrustServerCertificate=True
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./Chinook:/metadata
    depends_on:
      quench-sakila:
        condition: service_completed_successfully

  demoserver:
    build:
      context: ./demoserver
      dockerfile: demoserver.Dockerfile
    restart: always
    ports:
      - "${MSSQL_PORT:-1440}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_USERNAME=${MSSQL_SA_USERNAME}
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    healthcheck:
      test: /tmp/devdatabase/is-ready.sh
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  completed:
    image: alpine
    entrypoint: ["echo"]
    command: ["completed"]
    depends_on:
      demoserver:
        condition: service_healthy
      quench-adventureworks:
        condition: service_completed_successfully
      quench-northwind:
        condition: service_completed_successfully
      quench-sakila:
        condition: service_completed_successfully
      quench-chinook:
        condition: service_completed_successfully
